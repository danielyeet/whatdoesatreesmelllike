<!--
  THIS PAGE MOVED, AND THIS IS THE SIGNPOST LEFT WHERE IT STOOD.

  The six houses now live in `houses/` and the individual fragrances in
  `individual-fragrances/`, so that the repository sorts by what a thing
  IS rather than lumping every page into `works/`. Anything already
  linked or bookmarked at the old address still has to work, so each old
  address keeps a page like this one.

  IT FORWARDS THREE WAYS, and it needs all three:

    THE SCRIPT   goes at once AND CARRIES THE ANCHOR with it. This is
                 the one that matters: the Fragrances table links at a
                 part of a house by its anchor
                 (`pineward.html#part-37`), and a meta refresh drops
                 everything after the `#`. `replace` rather than
                 `assign`, so the back button steps over this page
                 instead of bouncing back into it.
    THE META     the fallback with no JavaScript. It loses the anchor,
                 which is why it is second rather than first.
    THE LINK     for anyone who has both turned off, and for a reader
                 that follows neither.

  Nothing else is on the page: it is a signpost, not a page.
-->
<link rel="canonical" href="../houses/les-abstraits.html">
<meta name="robots" content="noindex">
<script>location.replace("../houses/les-abstraits.html" + location.hash);</script>
