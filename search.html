<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — The Taste of Aldehydes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<!--
  THE SEARCH PAGE — the one place that looks over the whole site.

  It keeps no list of what is on the site. search-page.js fetches the
  pages named in its own manifest and reads each of them with the same
  collector the pages use on themselves, so anything added to a page is
  findable the moment it is added. The only thing to keep up to date is
  that manifest: one line per page, with the trail that says where a
  thing found in it lives.

  A page's own search hands anything it cannot answer to this page,
  with the question in the address (?q=...), which is why arriving here
  with nothing found is a state this page has rather than an error.

  THE GROUND is dark, and it is drawn rather than styled: find-ground.js
  hangs a field of specks behind the page, webbed to their near
  neighbours, and they answer the search — they gather towards the field
  and brighten as you type. There was a squared plan behind them for one
  round; the owner asked for the grid gone and the specks to carry the
  page on their own. The page is named beside the Menu, the way every
  other page on the site names itself; there is no title on the page
  proper, and no standfirst under it.
-->
<body class="find-page dark-surface">

<canvas class="find-ground" aria-hidden="true"></canvas>

<p class="page-where">Search</p>

<div class="find">

  <form class="find-form" role="search">
    <span class="find-mark" aria-hidden="true"></span>
    <label class="find-label" for="find-field">Search</label>
    <input class="find-field" id="find-field" type="search" name="q" autocomplete="off"
           placeholder="Search anything :)" aria-label="Search the site">
    <span class="find-count" aria-hidden="true">000</span>
  </form>

  <!--
    FILTERING. One button per kind of thing the site is made of, in the
    order they matter here. `data-kind` is the word search.js puts on an
    entry, so these are the categories themselves rather than a second
    list of them kept in step by hand. Adding a kind to search.js means
    adding one line here.
  -->
  <div class="find-filters" role="group" aria-label="Filter by kind">
    <button class="find-filter is-on" type="button" data-kind="">All</button>
    <button class="find-filter" type="button" data-kind="House">Houses</button>
    <button class="find-filter" type="button" data-kind="Fragrance">Fragrances</button>
    <button class="find-filter" type="button" data-kind="Research">Researches</button>
    <button class="find-filter" type="button" data-kind="Favourite">Favourites</button>
    <button class="find-filter" type="button" data-kind="Piece">Pieces</button>
    <button class="find-filter" type="button" data-kind="Section">Sections</button>
    <button class="find-filter" type="button" data-kind="Note">Notes</button>
  </div>

  <p class="find-reading-note" aria-hidden="true">Reading the site…</p>

  <section class="find-out" aria-live="polite">
    <p class="find-saying" aria-hidden="true"></p>
    <div class="find-results"></div>
    <p class="find-nothing" hidden>
      No results found.
      <span>Nothing on the site is called that — try fewer letters, or a house rather than a fragrance.</span>
    </p>
  </section>

</div>

<script>window.SITE_ROOT = "";</script>
<script src="nav.js"></script>
<script src="search.js"></script>
<script src="search-page.js"></script>
<script src="find-ground.js"></script>
</body>
</html>
