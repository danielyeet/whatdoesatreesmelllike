<link rel="stylesheet" href="../style.css">
<script>
  /* The page's own contents are held back for the moment between the
     first paint and this page's script taking over. Without it the
     browser shows the no-script version first — every picture in a
     plain grid — and then the script sweeps it all away, which reads
     as the page blinking its whole contents at you before it starts.

     It undoes itself if that script never arrives, so the no-script
     version of this page is still exactly what you get without one. */
  document.documentElement.classList.add("js-coming");
  var ready = function () {
    document.documentElement.classList.remove("js-coming");
  };
  /* If that script never arrives — blocked, missing, or broken — then
     the page's own contents ARE the page, so they are shown the moment
     everything else has finished loading. The timer is only a last
     resort behind that. */
  window.addEventListener("load", ready);
  setTimeout(ready, 4000);
</script>
</head>
<!--
  This page is one full "body of work" — a category — laid out as a
  CONTACT SHEET: the page opens white with one square window in the
  middle, every picture below flicks through it, it lands on the first
  one, and lines then reach out across the page to the rest, each
  carrying a date.

  EVERYTHING ON IT IS DRAWN IN PARTICLES: a picture is bounded by a
  fine chain of specks rather than by a ruled border, and every line
  between two pictures is a run of specks rather than a stroke. They
  are still — they are placed once, and the page does not answer the
  pointer.

  TO ADD A PIECE: copy one whole <a class="sheet-frame"> block below,
  point its href at the piece's page in /works/, uncomment the <img>
  and point it at your picture, and write the caption. Nothing else
  needs changing — the flick, the scatter and the lines all come from
  however many of these blocks are here.

  TO FEATURE A DIFFERENT PICTURE: move its block to the front. The
  sheet always lands on the first one.

  The pictures are square (1:1). A picture that isn't square is
  cropped to fit rather than squashed.

  TO ADD A NEW CATEGORY ENTIRELY: duplicate this whole file, rename
  it inside /categories/, update the <h1> and the lede, and add a
  line for it in the SITE_LINKS list near the top of nav.js. A
  category that wants a plain list instead of a sheet can copy any
  of the other pages in this folder.
-->
