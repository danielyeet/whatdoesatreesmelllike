<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<meta name="description" content="Photography and architecture portfolio.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body class="snap-page">

<!-- Squared paper and grain. Purely decorative, and invisible until
     the node map slide — see .paper in style.css and thread.js. -->
<div class="paper" aria-hidden="true">
  <div class="paper-grid"></div>
  <div class="paper-noise"></div>
</div>

<main id="scroll-container">

  <!-- SLIDE 1 — TITLE. Edit: the big line, the line under it. -->
  <section class="slide title-slide" id="slide-1">
    <div class="title-content">
      <h1>what does a tree smell like?</h1>
      <p class="title-sub">Photography and architecture</p>
    </div>
    <div class="title-block">
      <span>A portfolio</span>
      <span>2026 edition</span>
    </div>
    <button class="scroll-cue" id="scroll-cue" aria-label="Scroll to next section">
      <span>Scroll</span>
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 4v15M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </section>

  <!--
    SLIDE 2 — a single centered, italic line. Replace the filler
    text below with whatever you'd like this to actually say.
  -->
  <section class="slide intro-slide" id="slide-2">
    <div class="intro-content">
      <p class="intro-lede">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
        eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </p>
    </div>
  </section>

  <!--
    SLIDE 3 — THE NODE MAP (3D)
    See node-scene.js for the list of nodes — that's the only file
    you need to touch to add, remove, or relabel one.
  -->
  <section class="slide node-slide" id="slide-3">
    <div class="node-scene-wrap" id="node-scene">
      <canvas id="node-canvas"></canvas>
      <div class="node-labels" id="node-labels"></div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>window.SITE_ROOT = "";</script>
<script src="nav.js"></script>
<script src="landing.js"></script>
<script src="node-scene.js"></script>
<script src="thread.js"></script>
</body>
</html>
